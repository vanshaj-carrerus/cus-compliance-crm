[package]
name = "cus-compliance-software"
version = "1.1.0"
description = "CareerUS Compliance CRM desktop app"
authors = ["CareerUS Solutions"]
edition = "2021"

[lib]
name = "cus_compliance_software_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-opener = "2"
tauri-plugin-dialog = "2"
tauri-plugin-fs = "2"
tauri-plugin-notification = "2"
tauri-plugin-clipboard-manager = "2"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
